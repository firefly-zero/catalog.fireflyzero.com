desc: |
  You are crew on a transport vessel, attacked by the infamous ghost ship, The Flying Dutchman.

  Load the cannons and battle The Flying Dutchman in a fight to the death. When they hit you with their cannons, parts of your ship will start malfunctioning, requiring immediate action.

  Written using [Odin](https://odin-lang.org/) as part of the [Firefly Zero Jam #3](https://itch.io/jam/firefly-jam-3)

  ## Credits

  - Code (and some art) by: applejag
  - Font: embedded-graphics (downloaded from [fonts.fireflyzero.com](https://fonts.fireflyzero.com/ascii))
  - Background cloud & sea: [Moon and Sea Pixel Art Background](https://opengameart.org/content/moon-and-sea-pixel-art-background) ([OGA-BY 3.0](https://static.opengameart.org/OGA-BY-3.0.txt))
  - Playable character and special effects: [Haunted Love Boat](https://bubbabba.itch.io/haunted-love-boat) by [bubbabba](https://bubbabba.itch.io/)
  - Ship tileset: [A Pirate Ship Tiles & Decorations Set 16x16](https://kaiswerkstatt.itch.io/high-seas-pirate-ship-tiles-decorations) by [kaiswerkstatt](https://kaiswerkstatt.itch.io/)

  Third-party assets were modified to fit in a custom 16-color palette
