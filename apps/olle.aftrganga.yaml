desc: |
  Play as a draugr defending your haug from evil viking grave robbers.

  The aftrganga, or draugr, is a malevolent revenant that lives in a barrow
  guarding the treasure horde buried inside. It's a corporeal undead ghost of the
  deceased buried within the grave mound.

  Shoot all the invading viking grave robbers and try to survive for as long
  as possible.

  ## Keyboard controls

  - Arrow keys: move your draugr.
  - X or Enter: shoot.
  - TAB: Open menu to restart game.
  - Escape: close the game.

